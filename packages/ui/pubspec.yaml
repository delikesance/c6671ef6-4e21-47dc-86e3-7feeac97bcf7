name: bot_creator_ui
description: "Design system, traductions et composants visuels partagés entre l'app Bot Creator et le Studio web."
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_svg: ^2.3.0
  reicon_flutter: ^1.0.1
  bot_creator_shared: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  # Polices partagées (Inter + JetBrains Mono). Hors du paquet, elles se
  # référencent en `packages/bot_creator_ui/<famille>` (cf. [UiFonts]).
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/inter/Inter-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/jetbrainsmono/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/jetbrainsmono/JetBrainsMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/jetbrainsmono/JetBrainsMono-Bold.ttf
          weight: 700
