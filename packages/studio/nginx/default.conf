# Cache : les fichiers d'entrée de Flutter ne portent pas d'empreinte dans leur
# nom ; ils doivent être revalidés à chaque visite, sinon une mise à jour du
# Studio n'arrive jamais chez ceux qui l'ont déjà ouvert. Le reste (moteur,
# polices, icônes) peut rester une heure en cache.
map $uri $studio_cache_control {
    default                                                      "public, max-age=3600";
    ~^/(index\.html|flutter_bootstrap\.js|flutter_service_worker\.js|version\.json|manifest\.json)$  "no-cache";
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;

    # Un seul add_header par réponse : nginx ne combine pas ceux d'un bloc
    # `location` avec ceux du serveur, d'où ce bloc unique en tête.
    add_header Cache-Control $studio_cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    # La page de connexion Discord ne doit jamais être affichable dans un cadre
    # d'un autre site (détournement de clic).
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Sonde de santé pour l'orchestrateur.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Application monopage : toute URL inconnue retombe sur index.html (le
    # retour OAuth arrive sur « /?code=…&state=… »).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
