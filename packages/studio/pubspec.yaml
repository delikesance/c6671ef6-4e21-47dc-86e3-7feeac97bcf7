name: bot_creator_studio
description: "Bot Creator Studio — la version web (Flutter) de l'app Bot Creator."
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  bot_creator_shared: any
  bot_creator_ui: any
  http: ^1.6.0
  shared_preferences: ^2.5.5
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
  generate: true
