version: 2.1

# ── Parameters ────────────────────────────────────────────────────────────
parameters:
  build_latest:
    type: boolean
    default: false
  build_linux:
    type: boolean
    default: true
  build_macos:
    type: boolean
    default: true
  build_windows:
    type: boolean
    default: true

# ── Environment global ──────────────────────────────────────────────────
environment: &env-common
  FLUTTER_VERSION: "3.44.1"
  APP_DIR: packages/app

# ── Executors ────────────────────────────────────────────────────────────
executors:
  linux-ci:
    docker:
      - image: cimg/base:current
    resource_class: medium+
    working_directory: ~/project

  macos-ci:
    macos:
      xcode: "16.4.0"
    resource_class: m4pro.medium
    working_directory: ~/project

  windows-ci:
    machine:
      image: windows-server-2022-gui:current
    resource_class: windows.medium
    working_directory: ~/project

# ── Reusable commands ───────────────────────────────────────────────────
commands:
  checkout_and_prepare:
    description: "Checkout, strip overrides, fix SSH→HTTPS"
    steps:
      - checkout
      - run:
          name: Remove dependency overrides & fix git URLs
          command: |
            cd ~/project
            sed -i.bak '/dependency_overrides:/,$d' pubspec.yaml && rm -f pubspec.yaml.bak
            sed -i.bak 's|git@github.com:|https://github.com/|g' packages/app/pubspec.yaml && rm -f packages/app/pubspec.yaml.bak
            sed -i.bak 's|git@github.com:|https://github.com/|g' packages/runner/pubspec.yaml && rm -f packages/runner/pubspec.yaml.bak

  checkout_and_prepare_windows:
    description: "Checkout, strip overrides, fix SSH→HTTPS (Windows bash)"
    steps:
      - checkout
      - run:
          name: Remove dependency overrides & fix git URLs
          shell: bash.exe
          command: |
            cd ~/project
            sed -i '/dependency_overrides:/,$d' pubspec.yaml
            sed -i 's|git@github.com:|https://github.com/|g' packages/app/pubspec.yaml
            sed -i 's|git@github.com:|https://github.com/|g' packages/runner/pubspec.yaml

  install_flutter_linux:
    steps:
      - run:
          name: Install Flutter
          command: |
            FLUTTER_ARCHIVE="flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
            curl -sL "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/${FLUTTER_ARCHIVE}" -o "/tmp/${FLUTTER_ARCHIVE}"
            tar xf "/tmp/${FLUTTER_ARCHIVE}" -C $HOME/
            echo 'export PATH=$HOME/flutter/bin:$PATH' >> $BASH_ENV
            $HOME/flutter/bin/flutter config --no-enable-swift-package-manager

  install_flutter_macos:
    steps:
      - run:
          name: Install Flutter
          command: |
            FLUTTER_ARCHIVE="flutter_macos_arm64_${FLUTTER_VERSION}-stable.zip"
            curl -sL "https://storage.googleapis.com/flutter_infra_release/releases/stable/macos/${FLUTTER_ARCHIVE}" -o "/tmp/${FLUTTER_ARCHIVE}"
            unzip -q "/tmp/${FLUTTER_ARCHIVE}" -d $HOME/
            echo 'export PATH=$HOME/flutter/bin:$PATH' >> $BASH_ENV
            $HOME/flutter/bin/flutter config --no-enable-swift-package-manager

  install_flutter_windows:
    steps:
      - run:
          name: Install Flutter
          shell: bash.exe
          command: |
            FLUTTER_ARCHIVE="flutter_windows_${FLUTTER_VERSION}-stable.zip"
            curl -sL "https://storage.googleapis.com/flutter_infra_release/releases/stable/windows/${FLUTTER_ARCHIVE}" -o "/c/${FLUTTER_ARCHIVE}"
            unzip -q "/c/${FLUTTER_ARCHIVE}" -d /c/Users/circleci/
            echo 'export PATH=/c/Users/circleci/flutter/bin:$PATH' >> $BASH_ENV
            /c/Users/circleci/flutter/bin/flutter config --no-enable-swift-package-manager

  get_flutter_deps:
    steps:
      - run:
          name: Clean stale caches
          command: |
            cd ~/project
            rm -rf .dart_tool packages/app/.dart_tool packages/runner/.dart_tool packages/shared/.dart_tool
      - run:
          name: Get dependencies
          command: |
            cd ~/project
            flutter pub get

  get_flutter_deps_windows:
    steps:
      - run:
          name: Clean stale caches
          shell: bash.exe
          command: |
            cd ~/project
            rm -rf .dart_tool packages/app/.dart_tool packages/runner/.dart_tool packages/shared/.dart_tool
      - run:
          name: Get dependencies
          shell: bash.exe
          command: |
            cd ~/project
            flutter pub get

# ── Jobs ──────────────────────────────────────────────────────────────────
jobs:
  build_linux:
    executor: linux-ci
    parameters:
      build_latest:
        type: boolean
        default: false
      enabled:
        type: boolean
        default: true
    environment:
      <<: *env-common
      BUILD_LATEST: << parameters.build_latest >>
    steps:
      - run:
          name: Check if enabled
          command: |
            if [ "<< parameters.enabled >>" = "false" ]; then
              circleci-agent step halt
            fi
      - checkout_and_prepare
      - run:
          name: Install Linux build dependencies
          command: |
            sudo apt-get update
            sudo apt-get install -y \
              clang cmake curl git ninja-build pkg-config zip xz-utils \
              libgtk-3-dev liblzma-dev libstdc++-12-dev lld python3-pip \
              libwayland-dev libwayland-egl1 libxkbcommon-dev \
              libx11-dev libx11-xcb-dev libxcb1-dev \
              libxi-dev libxcursor-dev libxdamage-dev libxfixes-dev \
              libxrandr-dev libxtst-dev libcups2-dev \
              libglib2.0-dev libdbus-1-dev libfontconfig1-dev patchelf \
              libsecret-1-dev
            sudo pip3 install --break-system-packages awscli
      - install_flutter_linux
      - get_flutter_deps
      - run:
          name: Fetch embedded JS runner (Linux)
          command: |
            if [ -n "${RUNNER_JS_RELEASE_TAG:-}" ]; then
              cd ~/project
              chmod +x scripts/fetch-embedded-runner-js.sh
              TARGET_PLATFORM=linux-x64 RUNNER_JS_RELEASE_TAG="${RUNNER_JS_RELEASE_TAG}" \
                ./scripts/fetch-embedded-runner-js.sh
            else
              echo "RUNNER_JS_RELEASE_TAG not set — skipping embedded runner fetch"
            fi
      - run:
          name: Enable Linux desktop
          command: flutter config --enable-linux-desktop
      - run:
          name: Build Linux release
          command: |
            cd ~/project/packages/app
            flutter build linux --release
      - run:
          name: Verify Linux bundle
          command: |
            cd ~/project/packages/app
            BUNDLE_DIR="build/linux/x64/release/bundle"
            BINARY_PATH="$BUNDLE_DIR/bot_creator"
            if [ ! -d "$BUNDLE_DIR" ]; then
              echo "Linux bundle directory not found: $BUNDLE_DIR" >&2; exit 1
            fi
            if [ ! -f "$BINARY_PATH" ]; then
              echo "Linux executable not found: $BINARY_PATH" >&2; exit 1
            fi
            chmod +x "$BINARY_PATH"
      - run:
          name: Package Linux bundle
          command: |
            cd ~/project/packages/app
            STEAM_DIR="build/linux/x64/release/bot_creator-linux-x64-steam"
            rm -rf "$STEAM_DIR"
            mkdir -p "$STEAM_DIR"
            cp -a build/linux/x64/release/bundle "$STEAM_DIR/"

            BUNDLE_STEAM_DIR="$STEAM_DIR/bundle"
            LIB_DIR="$BUNDLE_STEAM_DIR/lib"
            mkdir -p "$LIB_DIR"

            # Only skip true kernel-ABI libs that must come from the host
            # (glibc, ld-linux, nss resolver) and GPU-driver libs that must
            # match the host hardware (libepoxy dlopen()s them at runtime).
            # Everything else — GTK, Wayland, X11, libstdc++, etc. — is
            # bundled for cross-distro portability.
            is_skip_lib() {
              case "$(basename "$1")" in
                linux-vdso.so.*|ld-linux*.so.*|ld-musl*.so.*) return 0 ;;
                libc.so.*|libm.so.*|libpthread.so.*|libdl.so.*) return 0 ;;
                librt.so.*|libresolv.so.*|libnss_*.so.*|libcrypt.so.*) return 0 ;;
                libutil.so.*) return 0 ;;
                # GPU driver libs — must come from the host (Mesa / NVIDIA / AMDGPU).
                # Bundling Ubuntu's Mesa dispatch stubs breaks NixOS, proprietary
                # NVIDIA, and any non-glibc distro. libepoxy dlopen()s the right
                # backend at runtime.
                libEGL.so.*|libGL.so.*|libGLX.so.*|libGLES*.so.*|libGLdispatch.so.*) return 0 ;;
                libOpenGL.so.*|libvulkan.so.*) return 0 ;;
              esac
              return 1
            }

            collect_deps() {
              local target="$1"
              ldd "$target" 2>/dev/null \
                | awk 'NF>=3 && $2=="=>"{print $3} NF==2 && $1~/^\//{print $1}' \
                | while read -r dep; do
                [ -f "$dep" ] || continue
                is_skip_lib "$dep" && continue
                local dep_name
                dep_name="$(basename "$dep")"
                [ -f "$LIB_DIR/$dep_name" ] && continue
                cp -L "$dep" "$LIB_DIR/$dep_name"
                collect_deps "$dep"
              done
            }

            if [ -f "$BUNDLE_STEAM_DIR/bot_creator" ]; then
              mv "$BUNDLE_STEAM_DIR/bot_creator" "$BUNDLE_STEAM_DIR/bot_creator.bin"
            fi
            collect_deps "$BUNDLE_STEAM_DIR/bot_creator.bin"
            [ -f "$LIB_DIR/libflutter_linux_gtk.so" ] && collect_deps "$LIB_DIR/libflutter_linux_gtk.so"

            # Libs that are dlopen()d at runtime (invisible to ldd) — must bundle explicitly.
            # NOTE: Do NOT bundle EGL/GL/GLX/GLES/Vulkan here.  Those are
            # GPU-driver libs that libepoxy dlopen()s from the host at runtime
            # and must match the actual hardware (NVIDIA, Mesa, AMDGPU).
            # Bundling them from CI's Ubuntu breaks NixOS, non-Mesa drivers, etc.
            DLOPEN_LIBS=(
              libwayland-client.so.0 libwayland-egl.so.1 libwayland-cursor.so.0
              libxkbcommon.so.0
              libgdk_pixbuf-2.0.so.0
            )
            for dlopen_lib in "${DLOPEN_LIBS[@]}"; do
              real="$(find /usr/lib /usr/lib/x86_64-linux-gnu -name "$dlopen_lib" -not -type d 2>/dev/null | head -1)"
              if [ -n "$real" ] && [ ! -f "$LIB_DIR/$dlopen_lib" ]; then
                cp -L "$real" "$LIB_DIR/$dlopen_lib"
                echo "  ↳ bundled (dlopen) $dlopen_lib ($real)"
                collect_deps "$real"
              fi
            done

            # Patch RPATH so bundled libs are found even on NixOS
            # (where LD_LIBRARY_PATH may be overridden by the Nix sandbox).
            patchelf --set-rpath '$ORIGIN/lib' "$BUNDLE_STEAM_DIR/bot_creator.bin" || true

            printf '#!/usr/bin/env bash\nset -euo pipefail\nHERE="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"\nexport LD_LIBRARY_PATH="$HERE/lib:${LD_LIBRARY_PATH:-}"\nexport PATH="$HERE:${PATH:-}"\n[ -n "${WAYLAND_DISPLAY:-}" ] && export WAYLAND_DISPLAY\nexec "$HERE/bot_creator.bin" "$@"\n' > "$BUNDLE_STEAM_DIR/bot_creator"
            chmod +x "$BUNDLE_STEAM_DIR/bot_creator"

            printf '#!/usr/bin/env bash\nunset LD_LIBRARY_PATH\nexec /usr/bin/xdg-open "$@"\n' > "$BUNDLE_STEAM_DIR/xdg-open"
            chmod +x "$BUNDLE_STEAM_DIR/xdg-open"

            (cd build/linux/x64/release && zip -r "$OLDPWD/build/bot_creator-linux-x64-steam.zip" bot_creator-linux-x64-steam)

      # ── S3 upload (tagged releases or latest) ──
      - run:
          name: Upload Linux artifacts to R2
          command: |
            EFFECTIVE_TAG="${CIRCLE_TAG:-}"
            if [ -z "$EFFECTIVE_TAG" ] && [ "${BUILD_LATEST:-}" = "true" ]; then EFFECTIVE_TAG="latest"; fi
            if [ -z "$EFFECTIVE_TAG" ]; then echo "Not a tagged release and not a latest build, skipping R2 upload."; exit 0; fi
            cd ~/project/packages/app
            aws s3 cp build/bot_creator-linux-x64-steam.zip "s3://${R2_BUCKET}/releases/${EFFECTIVE_TAG}/bot_creator-linux-x64-steam.zip" --endpoint-url "${R2_ENDPOINT}" --no-progress

  build_macos:
    executor: macos-ci
    parameters:
      build_latest:
        type: boolean
        default: false
      enabled:
        type: boolean
        default: true
    environment:
      <<: *env-common
      BUILD_LATEST: << parameters.build_latest >>
    steps:
      - run:
          name: Check if enabled
          command: |
            if [ "<< parameters.enabled >>" = "false" ]; then
              circleci-agent step halt
            fi
      - checkout_and_prepare
      - install_flutter_macos
      - get_flutter_deps
      - run:
          name: Enable macOS desktop
          command: flutter config --enable-macos-desktop
      - restore_cache:
          name: Restore CocoaPods cache
          keys:
            - cocoapods-v1-{{ checksum "packages/app/macos/Podfile.lock" }}
            - cocoapods-v1-
      - run:
          name: Install CocoaPods dependencies
          command: |
            cd ~/project/packages/app/macos
            rm -f Podfile.lock
            pod install --repo-update
      - run:
          name: Build macOS release
          command: |
            cd ~/project/packages/app
            flutter build macos --release
      - save_cache:
          name: Save CocoaPods cache
          key: cocoapods-v1-{{ checksum "packages/app/macos/Podfile.lock" }}
          paths:
            - ~/.cocoapods
            - ~/Library/Caches/CocoaPods
            - packages/app/macos/Pods
      - run:
          name: Package macOS app bundle
          command: |
            cd ~/project/packages/app
            APP_PATH=$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' -print -quit)
            if [ -z "$APP_PATH" ]; then
              echo "No macOS app bundle found." >&2; exit 1
            fi
            ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" build/bot_creator-macos-universal-steam.zip

      # ── S3 upload (tagged releases or latest) ──
      - run:
          name: Install awscli and upload macOS artifacts to R2
          command: |
            EFFECTIVE_TAG="${CIRCLE_TAG:-}"
            if [ -z "$EFFECTIVE_TAG" ] && [ "${BUILD_LATEST:-}" = "true" ]; then EFFECTIVE_TAG="latest"; fi
            if [ -z "$EFFECTIVE_TAG" ]; then echo "Not a tagged release and not a latest build, skipping R2 upload."; exit 0; fi
            HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_ASK=1 brew install awscli
            cd ~/project/packages/app
            aws s3 cp build/bot_creator-macos-universal-steam.zip "s3://${R2_BUCKET}/releases/${EFFECTIVE_TAG}/bot_creator-macos-universal-steam.zip" --endpoint-url "${R2_ENDPOINT}" --no-progress

  build_windows:
    executor: windows-ci
    parameters:
      build_latest:
        type: boolean
        default: false
      enabled:
        type: boolean
        default: true
    environment:
      <<: *env-common
      BUILD_LATEST: << parameters.build_latest >>
    steps:
      - run:
          name: Check if enabled
          shell: bash.exe
          command: |
            if [ "<< parameters.enabled >>" = "false" ]; then
              circleci-agent step halt
            fi
      - checkout_and_prepare_windows
      - install_flutter_windows
      - get_flutter_deps_windows
      - run:
          name: Fetch embedded JS runner (Windows)
          shell: bash.exe
          command: |
            if [ -n "${RUNNER_JS_RELEASE_TAG:-}" ]; then
              cd ~/project
              chmod +x scripts/fetch-embedded-runner-js.sh
              TARGET_PLATFORM=windows RUNNER_JS_RELEASE_TAG="${RUNNER_JS_RELEASE_TAG}" \
                ./scripts/fetch-embedded-runner-js.sh
            else
              echo "RUNNER_JS_RELEASE_TAG not set — skipping embedded runner fetch"
            fi
      - run:
          name: Enable Windows desktop
          command: flutter config --enable-windows-desktop
      - run:
          name: Build Windows release
          shell: bash.exe
          command: |
            cd ~/project/packages/app
            flutter build windows --release

      # ── ZIP ──
      - run:
          name: Package Windows ZIP
          shell: bash.exe
          command: |
            cd ~/project/packages/app
            python -c 'import sys, textwrap; exec(textwrap.dedent("""
              import zipfile, os
              src, dst = sys.argv[1], sys.argv[2]
              with zipfile.ZipFile(dst, "w", zipfile.ZIP_DEFLATED) as zf:
                  for root, dirs, files in os.walk(src):
                      for f in files:
                          if f.endswith(".pdb"): continue
                          p = os.path.join(root, f)
                          zf.write(p, os.path.relpath(p, src).replace(chr(92), chr(47)))
              print("Created:", dst)
            """))' build/windows/x64/runner/Release build/bot_creator-windows-x64-steam.zip

      # ── S3 upload (tagged releases or latest) ──
      - run:
          name: Install awscli and upload Windows artifacts to R2
          shell: bash.exe
          command: |
            EFFECTIVE_TAG="${CIRCLE_TAG:-}"
            if [ -z "$EFFECTIVE_TAG" ] && [ "${BUILD_LATEST:-}" = "true" ]; then EFFECTIVE_TAG="latest"; fi
            if [ -z "$EFFECTIVE_TAG" ]; then echo "Not a tagged release and not a latest build, skipping R2 upload."; exit 0; fi
            pip install --quiet awscli
            cd ~/project/packages/app
            aws s3 cp build/bot_creator-windows-x64-steam.zip "s3://${R2_BUCKET}/releases/${EFFECTIVE_TAG}/bot_creator-windows-x64-steam.zip" --endpoint-url "${R2_ENDPOINT}" --no-progress

# ── Workflows ─────────────────────────────────────────────────────────────
workflows:
  release:
    jobs:
      - build_linux:
          context: r2-deploy
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v[0-9]+\.[0-9]+\.[0-9]+.*/

      - build_macos:
          context: r2-deploy
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v[0-9]+\.[0-9]+\.[0-9]+.*/

      - build_windows:
          context: r2-deploy
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v[0-9]+\.[0-9]+\.[0-9]+.*/

  build_latest:
    when: << pipeline.parameters.build_latest >>
    jobs:
      - build_linux:
          context: r2-deploy
          build_latest: true
          enabled: << pipeline.parameters.build_linux >>
      - build_macos:
          context: r2-deploy
          build_latest: true
          enabled: << pipeline.parameters.build_macos >>
      - build_windows:
          context: r2-deploy
          build_latest: true
          enabled: << pipeline.parameters.build_windows >>