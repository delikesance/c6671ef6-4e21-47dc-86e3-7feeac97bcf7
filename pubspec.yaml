name: bot_creator_workspace
description: Mono-repo workspace for bot_creator app and runner
publish_to: none

environment:
  sdk: ^3.12.0

workspace:
  - packages/app
  - packages/runner

dependency_overrides:
  bot_creator_shared:
    path: packages/shared
  nyxx_lavalink:
    path: packages/nyxx_lavalink
