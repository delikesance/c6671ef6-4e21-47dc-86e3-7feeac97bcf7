name: Runner Docker

on:
  push:
    branches: ["master", "main"]
    tags:
      - "v*"
      - "runner-v*"
    paths:
      - "Dockerfile"
      - "pubspec.yaml"
      - "packages/runner/**"
      - "packages/shared/**"
      - ".github/workflows/runner-docker.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Push image to GHCR and Docker Hub"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

env:
  GHCR_REGISTRY: ghcr.io
  GHCR_IMAGE_NAME: ${{ github.repository_owner }}/bot-creator-runner
  DOCKERHUB_REGISTRY: docker.io
  DOCKERHUB_IMAGE_NAME: garder500/bot-creator-runner
  SMOKE_PLATFORM: linux/amd64
  PUBLISH_PLATFORMS: linux/amd64,linux/arm64
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build image
    runs-on: vps01
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local image (AOT Dockerfile)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: bot-creator-runner:ci
          platforms: ${{ env.SMOKE_PLATFORM }}

  publish:
    name: Publish image to registries
    needs: build
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true') }}
    runs-on: vps01
    env:
      DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
      HAS_DOCKERHUB_TOKEN: ${{ secrets.DOCKER_TOKEN != '' }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve latest version tag
        id: latest-tag
        run: |
          TAG=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          TAG=${TAG:-0.0.0}
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${TAG#v}"

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: env.HAS_DOCKERHUB_TOKEN == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKERHUB_REGISTRY }}
          username: garder500
          password: ${{ env.DOCKER_TOKEN }}

      - name: Extract GHCR Docker metadata
        id: meta-ghcr
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}},value=v${{ steps.latest-tag.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ steps.latest-tag.outputs.version }}
            type=semver,pattern={{major}},value=v${{ steps.latest-tag.outputs.version }}
            type=raw,value=stable,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Extract Docker Hub metadata
        if: env.HAS_DOCKERHUB_TOKEN == 'true'
        id: meta-dockerhub
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_REGISTRY }}/${{ env.DOCKERHUB_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}},value=v${{ steps.latest-tag.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ steps.latest-tag.outputs.version }}
            type=semver,pattern={{major}},value=v${{ steps.latest-tag.outputs.version }}
            type=raw,value=stable,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: ${{ env.PUBLISH_PLATFORMS }}
          tags: |
            ${{ steps.meta-ghcr.outputs.tags }}
            ${{ steps.meta-dockerhub.outputs.tags }}
          labels: ${{ steps.meta-ghcr.outputs.labels }}
