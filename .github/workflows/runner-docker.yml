name: Runner Docker

on:
  push:
    branches: ["master", "main"]
    tags:
      - "v*"
      - "runner-v*"
    paths:
      - "Dockerfile"
      - "pubspec.yaml"
      - "packages/runner/**"
  workflow_dispatch:
    inputs:
      publish:
        description: "Push image to GHCR and Docker Hub"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

env:
  GHCR_REGISTRY: ghcr.io
  GHCR_IMAGE_NAME: ${{ github.repository_owner }}/bot-creator-runner
  DOCKERHUB_REGISTRY: docker.io
  DOCKERHUB_IMAGE_NAME: garder500/bot-creator-runner
  SMOKE_PLATFORM: linux/amd64
  PUBLISH_PLATFORMS: linux/amd64,linux/arm64
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build and Publish
    runs-on: vps01
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Remove dependency overrides
        run: |
          sed -i '/dependency_overrides:/,$d' pubspec.yaml
          # Also remove local shared from Dockerfile workspace to force git pull
          sed -i 's/- packages\/shared//g' Dockerfile
          # Remove the copy of shared package as it is now external
          sed -i '/COPY packages\/shared/d' Dockerfile
          # Swap SSH for HTTPS in runner pubspec
          sed -i 's/git@github.com:/https:\/\/github.com\//g' packages/runner/pubspec.yaml



      - name: Set build configuration
        id: config
        env:
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
        run: |
          SHOULD_PUSH="${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true') }}"
          echo "push=$SHOULD_PUSH" >> "$GITHUB_OUTPUT"
          
          HAS_DOCKER_TOKEN=$([ -n "$DOCKER_TOKEN" ] && echo "true" || echo "false")
          echo "has_docker_token=$HAS_DOCKER_TOKEN" >> "$GITHUB_OUTPUT"

          if [ "$SHOULD_PUSH" = "true" ]; then
            echo "platforms=${{ env.PUBLISH_PLATFORMS }}" >> "$GITHUB_OUTPUT"
          else
            echo "platforms=${{ env.SMOKE_PLATFORM }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve latest version tag
        if: steps.config.outputs.push == 'true'
        id: latest-tag
        run: |
          TAG=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          TAG=${TAG:-0.0.0}
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${TAG#v}"

      - name: Login to GHCR
        if: steps.config.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: steps.config.outputs.push == 'true' && steps.config.outputs.has_docker_token == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKERHUB_REGISTRY }}
          username: garder500
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}
            ${{ env.DOCKERHUB_REGISTRY }}/${{ env.DOCKERHUB_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}},value=v${{ steps.latest-tag.outputs.version }},enable=${{ steps.config.outputs.push == 'true' }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ steps.latest-tag.outputs.version }},enable=${{ steps.config.outputs.push == 'true' }}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=stable,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ steps.config.outputs.push == 'true' }}
          load: ${{ steps.config.outputs.push != 'true' }}
          platforms: ${{ steps.config.outputs.platforms }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
