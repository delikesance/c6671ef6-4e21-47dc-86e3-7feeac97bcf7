name: CI

on:
  push:
    branches: [main, master, dev]
    tags:
      - "v*"
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  packages: write
  security-events: write

env:
  GHCR_REGISTRY: ghcr.io
  GHCR_IMAGE_NAME: ${{ github.repository_owner }}/bot-creator-runner
  DOCKERHUB_REGISTRY: docker.io
  DOCKERHUB_IMAGE_NAME: garder500/bot-creator-runner

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Resolve workspace dependencies
        run: flutter pub get

      - name: Analyze packages
        run: |
          dart analyze packages/runner packages/shared
          flutter analyze packages/app

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Resolve workspace dependencies
        run: flutter pub get

      - name: Run unit tests
        run: |
          cd packages/runner && dart test
          cd ../shared && dart test
          cd ../app && flutter test

  api-integration-tests:
    name: API integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Resolve workspace dependencies
        run: flutter pub get

      - name: Run runner integration tests
        run: cd packages/runner && dart test test/discord_runner_reload_mode_test.dart test/runner_runtime_controller_metrics_test.dart

  swagger-drift:
    name: Swagger drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Check ARB translations and localization sync
        run: |
          if [ -d "packages/app" ]; then
            cd packages/app && flutter pub get
            dart run tools/check_hardcoded_strings.dart || true
          fi

  source-security:
    name: Source security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy filesystem vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: actions

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  container-build-scan:
    name: Container build and scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: local/runner:${{ github.sha }}
          build-args: |
            CACHEBUST=${{ github.run_id }}-${{ github.run_attempt }}

      - name: Run Trivy container vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: local/runner:${{ github.sha }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  auto-release:
    name: Auto Release & SemVer Tag
    needs: [quality, unit-tests, api-integration-tests, swagger-drift, source-security, codeql, container-build-scan]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute SemVer Tag
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            LAST_TAG=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n1 || echo "")
            if [ -z "$LAST_TAG" ]; then
              TAG="v2.0.${{ github.run_number }}"
            else
              BASE=${LAST_TAG#v}
              MAJOR=$(echo $BASE | cut -d. -f1)
              MINOR=$(echo $BASE | cut -d. -f2)
              PATCH=$(echo $BASE | cut -d. -f3)
              PATCH=$((PATCH + 1))
              TAG="v${MAJOR}.${MINOR}.${PATCH}"
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Calculated tag: $TAG"

      - name: Create Git Tag & Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          generate_release_notes: true

  publish-image:
    name: Publish immutable image
    needs: [auto-release]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: env.DOCKER_TOKEN != ''
        env:
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKERHUB_REGISTRY }}
          username: garder500
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}
            ${{ env.DOCKERHUB_REGISTRY }}/${{ env.DOCKERHUB_IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.auto-release.outputs.tag }}
            type=raw,value=${{ needs.auto-release.outputs.version }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            CACHEBUST=${{ github.run_id }}-${{ github.run_attempt }}

  ci-success:
    name: ci-success
    needs:
      - quality
      - unit-tests
      - api-integration-tests
      - swagger-drift
      - source-security
      - codeql
      - container-build-scan
      - auto-release
      - publish-image
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check pipeline results
        run: |
          if [[ "${{ needs.quality.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.unit-tests.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.api-integration-tests.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.swagger-drift.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.source-security.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.codeql.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ needs.container-build-scan.result }}" != "success" ]]; then exit 1; fi
          if [[ "${{ github.event_name }}" == "push" && ("${{ github.ref }}" == "refs/heads/main" || "${{ github.ref }}" == "refs/heads/master") ]]; then
            if [[ "${{ needs.auto-release.result }}" != "success" ]]; then exit 1; fi
            if [[ "${{ needs.publish-image.result }}" != "success" ]]; then exit 1; fi
          fi
          echo "All required CI checks passed successfully."
