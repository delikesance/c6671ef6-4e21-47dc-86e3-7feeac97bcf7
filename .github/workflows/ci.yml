# Décision : le gate local `make check` (-> scripts/pre-push.sh) exécute l'analyse et les tests
# du monorepo complet (runner, shared, app mobile). Les jobs de test/analyse/scan source distants
# sont donc retirés au profit de ce gate local, bien plus rapide à itérer.
# La CI distante ne garde que ce qui ne peut pas tourner en local : release SemVer + tag,
# build/scan de l'image Docker et publication sur les registres.
# Le tag de release suit les Conventional Commits depuis le dernier tag (feat -> minor,
# type! / BREAKING CHANGE -> major, le reste -> patch), forçable via workflow_dispatch
# (entrée bump). La version de départ reste celle du pubspec de l'app et le numéro de
# build Flutter (+N) ne redescend jamais : les stores refusent un build déjà publié.
name: CI

on:
  push:
    branches: [main, master]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      bump:
        description: "Type de montée de version (auto = déduite des Conventional Commits)"
        type: choice
        default: auto
        options: [auto, patch, minor, major]

permissions:
  actions: read
  contents: write
  packages: write
  security-events: write

env:
  GHCR_REGISTRY: ghcr.io
  GHCR_IMAGE_NAME: ${{ github.repository_owner }}/bot-creator-runner
  DOCKERHUB_REGISTRY: docker.io
  DOCKERHUB_IMAGE_NAME: garder500/bot-creator-runner

jobs:
  auto-release:
    name: Auto Release & SemVer Tag
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))) || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute and Bump SemVer
        id: version
        # L'entrée de workflow_dispatch passe par l'environnement : shellcheck ne sait
        # pas parser la syntaxe d'expression GitHub placée dans le script, et l'y
        # laisser faisait échouer le lint du workflow.
        env:
          FORCED_BUMP: ${{ github.event.inputs.bump }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            # Push d'un tag : la version est déjà décidée, on ne réécrit rien.
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
          else
            # La version de départ reste celle du pubspec de l'app : c'est lui qui
            # est publié, et c'est lui qui est réécrit juste en dessous.
            CURRENT_FULL=$(grep -oP '(?<=version: )\S+' packages/app/pubspec.yaml)
            CURRENT_VER="${CURRENT_FULL%%+*}"
            CURRENT_BUILD="${CURRENT_FULL##*+}"
            # Pas de « +N » dans le pubspec : on repart de 1 (comme avant).
            if [ "$CURRENT_BUILD" = "$CURRENT_FULL" ]; then CURRENT_BUILD="1"; fi

            MAJOR="${CURRENT_VER%%.*}"
            REST="${CURRENT_VER#*.}"
            MINOR="${REST%%.*}"
            PATCH="${REST#*.}"

            LAST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n1 || true)
            if [ -z "$LAST_TAG" ]; then
              # Aucun tag : le bump se déduit de tout l'historique (la version de
              # départ, elle, vient toujours du pubspec).
              RANGE="HEAD"
            else
              RANGE="${LAST_TAG}..HEAD"
            fi

            # Le type de bump est DÉDUIT des Conventional Commits au lieu d'être
            # systématiquement un « patch + 1 » : jusqu'ici une release qui
            # n'apportait qu'un correctif et une release qui apportait des
            # fonctionnalités finissaient au même endroit, et les montées mineures
            # et majeures ne sortaient donc jamais.
            # 'auto' (défaut) : type!: ou footer BREAKING CHANGE -> major ;
            # feat -> minor ; tout le reste (fix, perf, chore, docs, ci) -> patch.
            # On lit les SUJETS et les CORPS : le footer BREAKING CHANGE n'est
            # jamais dans le sujet.
            # Sur un push, l'entrée de workflow_dispatch est vide : le défaut 'auto'
            # est donc posé ici, jamais dans une expression GitHub.
            BUMP="${FORCED_BUMP:-auto}"
            if [ "$BUMP" = "auto" ]; then
              if git log --format='%s%n%b' "$RANGE" | grep -qE '^[a-zA-Z]+(\([^)]*\))?!:|^BREAKING[ -]CHANGE:'; then
                BUMP="major"
              elif git log --format='%s' "$RANGE" | grep -qE '^feat(\([^)]*\))?:'; then
                BUMP="minor"
              else
                # Quoté à dessein : sans guillemets, « patch » ferait tiquer le
                # linter (SC2209), parce que c'est aussi une commande système.
                BUMP="patch"
              fi
            fi

            case "$BUMP" in
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              patch) PATCH=$((PATCH + 1)) ;;
              *) echo "bump invalide: $BUMP"; exit 1 ;;
            esac

            VERSION="${MAJOR}.${MINOR}.${PATCH}"
            TAG="v${VERSION}"

            # Relance du workflow, ou tag déjà posé à la main : on ne réécrit pas un
            # tag existant (l'action de release échouerait), on avance d'un patch.
            while git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; do
              LAST_PATCH="${TAG##*.}"
              TAG="${TAG%.*}.$((LAST_PATCH + 1))"
              echo "Tag déjà existant, on continue en $TAG"
            done
            VERSION="${TAG#v}"

            # Le numéro de build Flutter (+N) ne redescend JAMAIS, quel que soit le
            # bump : les stores refusent un build déjà publié.
            BUILD_NUMBER=$((CURRENT_BUILD + 1))
            NEW_FULL="${VERSION}+${BUILD_NUMBER}"

            echo "Bump: $BUMP (dernier tag: ${LAST_TAG:-aucun}, $(git rev-list --count "$RANGE") commit(s))"
            echo "Bumping Flutter app version to $NEW_FULL"
            sed -i -E "s/^version: .*/version: $NEW_FULL/" packages/app/pubspec.yaml
            if [ -f packages/runner/pubspec.yaml ]; then
              sed -i -E "s/^version: .*/version: $VERSION/" packages/runner/pubspec.yaml
            fi

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add packages/app/pubspec.yaml packages/runner/pubspec.yaml
            git commit -m "chore(release): bump app version to $NEW_FULL [skip ci]" || echo "No changes to commit"
            git push origin "HEAD:${GITHUB_REF#refs/heads/}"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Calculated tag: $TAG ($VERSION)"

      - name: Create Git Tag & Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          generate_release_notes: true

  publish-image:
    name: Publish immutable image
    needs: [auto-release]
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))) || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: env.DOCKER_TOKEN != ''
        env:
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKERHUB_REGISTRY }}
          username: garder500
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}
            ${{ env.DOCKERHUB_REGISTRY }}/${{ env.DOCKERHUB_IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.auto-release.outputs.tag }}
            type=raw,value=${{ needs.auto-release.outputs.version }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build image locally for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: local/runner:scan-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            CACHEBUST=${{ github.run_id }}-${{ github.run_attempt }}

      - name: Scan image before push (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: local/runner:scan-${{ github.sha }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            CACHEBUST=${{ github.run_id }}-${{ github.run_attempt }}
