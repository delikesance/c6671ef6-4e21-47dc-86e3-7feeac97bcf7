# Décision : le gate local `make check` (-> scripts/pre-push.sh) exécute l'analyse et les tests
# du monorepo complet (runner, shared, app mobile). Les jobs de test/analyse/scan source distants
# sont donc retirés au profit de ce gate local, bien plus rapide à itérer.
# La CI distante ne garde que ce qui ne peut pas tourner en local : release SemVer + tag,
# build/scan de l'image Docker et publication sur les registres.
name: CI

on:
  push:
    branches: [main, master]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  packages: write
  security-events: write

env:
  GHCR_REGISTRY: ghcr.io
  GHCR_IMAGE_NAME: ${{ github.repository_owner }}/bot-creator-runner
  DOCKERHUB_REGISTRY: docker.io
  DOCKERHUB_IMAGE_NAME: garder500/bot-creator-runner

jobs:
  auto-release:
    name: Auto Release & SemVer Tag
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))) || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute and Bump SemVer
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
          else
            CURRENT_FULL=$(grep -oP '(?<=version: )\S+' packages/app/pubspec.yaml)
            CURRENT_VER=$(echo "$CURRENT_FULL" | cut -d+ -f1)
            CURRENT_BUILD=$(echo "$CURRENT_FULL" | cut -s -d+ -f2)
            if [ -z "$CURRENT_BUILD" ]; then CURRENT_BUILD="1"; fi

            MAJOR=$(echo "$CURRENT_VER" | cut -d. -f1)
            MINOR=$(echo "$CURRENT_VER" | cut -d. -f2)
            PATCH=$(echo "$CURRENT_VER" | cut -d. -f3)
            PATCH=$((PATCH + 1))
            BUILD_NUMBER=$((CURRENT_BUILD + 1))

            VERSION="${MAJOR}.${MINOR}.${PATCH}"
            TAG="v${VERSION}"
            NEW_FULL="${VERSION}+${BUILD_NUMBER}"

            echo "Bumping Flutter app version to $NEW_FULL"
            sed -i -E "s/^version: .*/version: $NEW_FULL/" packages/app/pubspec.yaml
            if [ -f packages/runner/pubspec.yaml ]; then
              sed -i -E "s/^version: .*/version: $VERSION/" packages/runner/pubspec.yaml
            fi

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add packages/app/pubspec.yaml packages/runner/pubspec.yaml
            git commit -m "chore(release): bump app version to $NEW_FULL [skip ci]" || echo "No changes to commit"
            git push origin HEAD:${{ github.ref_name }}
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Calculated tag: $TAG ($VERSION)"

      - name: Create Git Tag & Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          generate_release_notes: true

  publish-image:
    name: Publish immutable image
    needs: [auto-release]
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))) || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: env.DOCKER_TOKEN != ''
        env:
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKERHUB_REGISTRY }}
          username: garder500
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}
            ${{ env.DOCKERHUB_REGISTRY }}/${{ env.DOCKERHUB_IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.auto-release.outputs.tag }}
            type=raw,value=${{ needs.auto-release.outputs.version }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build image locally for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: local/runner:scan-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            CACHEBUST=${{ github.run_id }}-${{ github.run_attempt }}

      - name: Scan image before push (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: local/runner:scan-${{ github.sha }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            CACHEBUST=${{ github.run_id }}-${{ github.run_attempt }}
