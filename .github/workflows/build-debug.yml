name: CI Tests

on:
  pull_request:
    branches: ["master", "main"]

env:
  FLUTTER_VERSION: "3.44.1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  analyze_and_test:
    runs-on: vps01

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true
          pub-cache: false

      - name: Install workspace dependencies
        run: |
          rm -rf "${{ github.workspace }}/.dart_tool"
          rm -rf "${{ github.workspace }}/packages/app/.dart_tool"
          rm -rf "${{ github.workspace }}/packages/runner/.dart_tool"
          rm -rf "${{ github.workspace }}/packages/shared/.dart_tool"
          flutter pub get

      - name: Analyze shared package
        run: dart analyze packages/shared

      - name: Analyze runner package
        run: dart analyze packages/runner

      - name: Analyze app package
        run: flutter analyze packages/app

      - name: Run app tests
        run: flutter test packages/app/test --reporter expanded

      - name: Run runner tests
        run: dart test packages/runner/test