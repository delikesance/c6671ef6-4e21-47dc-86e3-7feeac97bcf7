name: CI Tests

on:
  pull_request:
    branches: ["master", "main"]
  push:
    branches: ["master", "main"]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.41.2"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  analyze_and_test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true
          pub-cache: false

      - name: Install workspace dependencies
        run: flutter pub get

      - name: Verify generated translations are up to date
        shell: bash
        run: |
          cd packages/app
          dart run tools/generate_trad_from_arb.dart
          if ! git diff --exit-code -- lib/utils/trad/en.dart lib/utils/trad/fr.dart; then
            echo "Generated translation maps are out of date." >&2
            echo "Run: cd packages/app && dart run tools/generate_trad_from_arb.dart" >&2
            exit 1
          fi

      - name: Analyze shared package
        run: dart analyze packages/shared

      - name: Analyze runner package
        run: dart analyze packages/runner

      - name: Analyze app package
        run: flutter analyze packages/app

      - name: Run app tests
        run: flutter test packages/app/test --reporter expanded

      - name: Run shared tests
        run: dart test packages/shared/test

      - name: Run runner tests
        run: dart test packages/runner/test