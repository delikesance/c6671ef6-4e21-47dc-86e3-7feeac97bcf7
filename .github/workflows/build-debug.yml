name: CI Tests

on:
  pull_request:
    branches: ["master", "main"]

env:
  FLUTTER_VERSION: "3.41.2"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  analyze_and_test:
    runs-on: vps01

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Remove dependency overrides
        run: |
          sed -i '/dependency_overrides:/,$d' pubspec.yaml
          # Swap SSH for HTTPS to avoid SSH key issues in CI
          sed -i 's/git@github.com:/https:\/\/github.com\//g' packages/app/pubspec.yaml
          sed -i 's/git@github.com:/https:\/\/github.com\//g' packages/runner/pubspec.yaml



      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true
          pub-cache: false

      - name: Install workspace dependencies
        run: |
          rm -rf "${{ github.workspace }}/.dart_tool"
          rm -rf "${{ github.workspace }}/packages/app/.dart_tool"
          rm -rf "${{ github.workspace }}/packages/runner/.dart_tool"
          rm -rf "${{ github.workspace }}/packages/shared/.dart_tool"
          flutter pub get
          dart pub upgrade bot_creator_shared

      - name: Analyze runner package
        run: dart analyze packages/runner

      - name: Analyze app package
        run: flutter analyze packages/app

      - name: Run app tests
        run: flutter test packages/app/test --reporter expanded

      - name: Run runner tests
        run: dart test packages/runner/test