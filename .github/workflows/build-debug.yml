name: CI Tests

on:
  pull_request:
    branches: ["master", "main"]
  push:
    branches: ["master", "main"]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.41.2"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  analyze_and_test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install workspace dependencies
        run: flutter pub get

      - name: Analyze shared package
        run: dart analyze packages/shared

      - name: Analyze runner package
        run: dart analyze packages/runner

      - name: Analyze app package
        run: flutter analyze packages/app

      - name: Run app tests
        run: flutter test packages/app/test --reporter expanded

      - name: Run shared tests
        run: dart test packages/shared/test

      - name: Run runner tests
        run: dart test packages/runner/test

  smoke_build_linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/app

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake curl git ninja-build pkg-config zip libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Get dependencies
        run: flutter pub get

      - name: Enable Linux Flutter Desktop
        run: flutter config --enable-linux-desktop

      - name: Smoke build Linux desktop
        run: flutter build linux --debug

  smoke_build_windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: packages/app

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~\AppData\Local\Pub\Cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Get dependencies
        run: flutter pub get

      - name: Enable Windows Flutter Desktop
        run: flutter config --enable-windows-desktop

      - name: Smoke build Windows desktop
        run: flutter build windows --debug

  smoke_build_macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: packages/app

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Get dependencies
        run: flutter pub get

      - name: Enable macOS Flutter Desktop
        run: flutter config --enable-macos-desktop

      - name: Smoke build macOS desktop
        run: flutter build macos --debug --no-codesign
