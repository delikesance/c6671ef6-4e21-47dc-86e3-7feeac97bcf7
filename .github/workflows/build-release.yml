name: Build Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  APP_DIR: packages/app
  FLUTTER_VERSION: "3.41.2"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  prepare_release:
    runs-on: vps01
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
    outputs:
      publish_release: ${{ steps.meta.outputs.publish_release }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      release_name: ${{ steps.meta.outputs.release_name }}
      release_prerelease: ${{ steps.meta.outputs.release_prerelease }}
      msix_only: ${{ steps.meta.outputs.msix_only }}
    steps:
      - name: Determine release target
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "publish_release=true" >> "$GITHUB_OUTPUT"
            echo "release_tag=msix-pre-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "release_name=MSIX Pre-release ${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "release_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "msix_only=true" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            echo "publish_release=true" >> "$GITHUB_OUTPUT"
            echo "release_tag=alpha-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "release_name=Alpha Release ${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            echo "release_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "msix_only=false" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "publish_release=true" >> "$GITHUB_OUTPUT"
            echo "release_tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "release_name=Release ${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "release_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "msix_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish_release=false" >> "$GITHUB_OUTPUT"
            echo "msix_only=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release shell
        if: ${{ steps.meta.outputs.publish_release == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
          RELEASE_NAME: ${{ steps.meta.outputs.release_name }}
          RELEASE_PRERELEASE: ${{ steps.meta.outputs.release_prerelease }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" -R "$GH_REPO" >/dev/null 2>&1; then
            exit 0
          fi

          args=(--title "$RELEASE_NAME" --target "$GITHUB_SHA" --notes "")
          if [ "$RELEASE_PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi

          gh release create "$RELEASE_TAG" -R "$GH_REPO" "${args[@]}"

  build_linux_release:
    runs-on: vps01
    needs: prepare_release
    # On ignore tout le job Linux si on a demandé que le MSIX
    if: ${{ needs.prepare_release.outputs.msix_only != 'true' }}
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.prepare_release.outputs.release_tag }}
      PUBLISH_RELEASE: ${{ needs.prepare_release.outputs.publish_release }}
    defaults:
      run:
        working-directory: packages/app

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Remove dependency overrides
        run: |
          sed -i '/dependency_overrides:/,$d' ../../pubspec.yaml
          sed -i 's/git@github.com:/https:\/\/github.com\//g' pubspec.yaml
          sed -i 's/git@github.com:/https:\/\/github.com\//g' ../runner/pubspec.yaml



      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake curl git ninja-build pkg-config zip libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
          pub-cache: false

      - name: Get dependencies
        run: |
          rm -rf "${{ github.workspace }}/.dart_tool"
          rm -rf "${{ github.workspace }}/packages/app/.dart_tool"
          rm -rf "${{ github.workspace }}/packages/runner/.dart_tool"
          rm -rf "${{ github.workspace }}/packages/shared/.dart_tool"
          flutter pub get
          dart pub upgrade bot_creator_shared

      - name: Enable Linux Flutter Desktop
        run: flutter config --enable-linux-desktop

      - name: Build Linux release
        run: flutter build linux --release

      - name: Verify Linux release bundle
        shell: bash
        run: |
          BUNDLE_DIR="build/linux/x64/release/bundle"
          BINARY_PATH="$BUNDLE_DIR/bot_creator"

          if [ ! -d "$BUNDLE_DIR" ]; then
            echo "Linux bundle directory not found: $BUNDLE_DIR" >&2
            exit 1
          fi

          if [ ! -f "$BINARY_PATH" ]; then
            echo "Linux executable not found: $BINARY_PATH" >&2
            echo "Bundle content:" >&2
            find "$BUNDLE_DIR" -maxdepth 2 -type f | sort >&2
            exit 1
          fi

          chmod +x "$BINARY_PATH"

      - name: Package Linux Steam bundle
        shell: bash
        run: |
          STEAM_DIR="build/linux/x64/release/bot_creator-linux-x64-steam"
          rm -rf "$STEAM_DIR"
          mkdir -p "$STEAM_DIR"
          cp -a build/linux/x64/release/bundle "$STEAM_DIR/"

          BUNDLE_STEAM_DIR="$STEAM_DIR/bundle"
          LIB_DIR="$BUNDLE_STEAM_DIR/lib"
          mkdir -p "$LIB_DIR"

          collect_deps() {
            local target="$1"
            ldd "$target" | awk '/=> \/[^ ]+/ { print $3 } /^\/[^ ]+/ { print $1 }' | while read -r dep; do
              [ -f "$dep" ] || continue

              case "$(basename "$dep")" in
                linux-vdso.so.*|ld-linux*.so.*|libc.so.*|libm.so.*|libpthread.so.*|libdl.so.*|librt.so.*|libresolv.so.*|libnss_*.so.*|libcrypt.so.*)
                  continue
                  ;;
              esac

              local dep_name
              dep_name="$(basename "$dep")"
              if [ -f "$LIB_DIR/$dep_name" ]; then
                continue
              fi

              cp -L "$dep" "$LIB_DIR/$dep_name"
              collect_deps "$dep"
            done
          }

          if [ -f "$BUNDLE_STEAM_DIR/bot_creator" ]; then
            mv "$BUNDLE_STEAM_DIR/bot_creator" "$BUNDLE_STEAM_DIR/bot_creator.bin"
          fi

          collect_deps "$BUNDLE_STEAM_DIR/bot_creator.bin"
          if [ -f "$LIB_DIR/libflutter_linux_gtk.so" ]; then
            collect_deps "$LIB_DIR/libflutter_linux_gtk.so"
          fi

          cat > "$BUNDLE_STEAM_DIR/bot_creator" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          HERE="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          export LD_LIBRARY_PATH="$HERE/lib:${LD_LIBRARY_PATH:-}"
          export PATH="$HERE:${PATH:-}"
          exec "$HERE/bot_creator.bin" "$@"
          EOF
          chmod +x "$BUNDLE_STEAM_DIR/bot_creator"

          cat > "$BUNDLE_STEAM_DIR/xdg-open" <<'EOF'
          #!/usr/bin/env bash
          unset LD_LIBRARY_PATH
          exec /usr/bin/xdg-open "$@"
          EOF
          chmod +x "$BUNDLE_STEAM_DIR/xdg-open"

          mkdir -p "$GITHUB_WORKSPACE/$APP_DIR/build"
          rm -f "$GITHUB_WORKSPACE/$APP_DIR/build/bot_creator-linux-x64-steam.zip"
          (cd build/linux/x64/release && zip -r "$GITHUB_WORKSPACE/$APP_DIR/build/bot_creator-linux-x64-steam.zip" bot_creator-linux-x64-steam)

      - name: Upload Linux Steam ZIP to release
        if: ${{ env.PUBLISH_RELEASE == 'true' }}
        shell: bash
        run: |
          gh release upload "$RELEASE_TAG" "build/bot_creator-linux-x64-steam.zip" --clobber -R "$GH_REPO"

      - name: Build Linux AppImage
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: bash packaging/linux/appimage/build_appimage.sh

      - name: Upload AppImage to release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: |
          gh release upload "$RELEASE_TAG" "build/appimage/bot_creator-linux-x86_64.AppImage" --clobber -R "$GH_REPO"

  build_macos_release:
    runs-on: macos-latest
    needs: prepare_release
    # On ignore tout le job macOS si on a demandé que le MSIX
    if: ${{ needs.prepare_release.outputs.msix_only != 'true' }}
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.prepare_release.outputs.release_tag }}
      PUBLISH_RELEASE: ${{ needs.prepare_release.outputs.publish_release }}
    defaults:
      run:
        working-directory: packages/app

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Remove dependency overrides
        run: |
          sed -i '/dependency_overrides:/,$d' ../../pubspec.yaml
          sed -i 's/git@github.com:/https:\/\/github.com\//g' pubspec.yaml
          sed -i 's/git@github.com:/https:\/\/github.com\//g' ../runner/pubspec.yaml



      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
          pub-cache: false

      - name: Get dependencies
        run: |
          rm -rf "${{ github.workspace }}/.dart_tool"
          rm -rf "${{ github.workspace }}/packages/app/.dart_tool"
          rm -rf "${{ github.workspace }}/packages/runner/.dart_tool"
          rm -rf "${{ github.workspace }}/packages/shared/.dart_tool"
          flutter pub get
          dart pub upgrade bot_creator_shared

      - name: Enable macOS Flutter Desktop
        run: flutter config --enable-macos-desktop

      - name: Build macOS release
        run: flutter build macos --release

      - name: Package macOS Steam app bundle
        run: |
          APP_PATH=$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "No macOS app bundle found in build output." >&2
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" build/bot_creator-macos-universal-steam.zip

      - name: Upload macOS Steam bundle to release
        if: ${{ env.PUBLISH_RELEASE == 'true' }}
        shell: bash
        run: |
          gh release upload "$RELEASE_TAG" "build/bot_creator-macos-universal-steam.zip" --clobber -R "$GH_REPO"

  build_windows_release:
    runs-on: windows-latest
    needs: prepare_release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.prepare_release.outputs.release_tag }}
      PUBLISH_RELEASE: ${{ needs.prepare_release.outputs.publish_release }}
    defaults:
      run:
        working-directory: packages/app

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Remove dependency overrides
        shell: bash
        run: |
          sed -i '/dependency_overrides:/,$d' ../../pubspec.yaml
          sed -i 's/git@github.com:/https:\/\/github.com\//g' pubspec.yaml
          sed -i 's/git@github.com:/https:\/\/github.com\//g' ../runner/pubspec.yaml



      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
          pub-cache: false

      - name: Get dependencies
        shell: bash
        run: |
          rm -rf "${{ github.workspace }}/.dart_tool"
          rm -rf "${{ github.workspace }}/packages/app/.dart_tool"
          rm -rf "${{ github.workspace }}/packages/runner/.dart_tool"
          rm -rf "${{ github.workspace }}/packages/shared/.dart_tool"
          flutter pub get
          dart pub upgrade bot_creator_shared

      - name: Enable Windows Flutter Desktop
        run: flutter config --enable-windows-desktop

      # Obligatoire : on build l'app Windows de base pour pouvoir l'empaqueter en MSIX ensuite
      - name: Build Windows release
        run: flutter build windows --release

      # --- ÉTAPES IGNORÉES EN MODE MSIX ONLY ---
      - name: Package Windows Steam ZIP
        if: ${{ needs.prepare_release.outputs.msix_only != 'true' }}
        shell: bash
        run: |
          python -c '
import zipfile, os, sys
src, dst = sys.argv[1], sys.argv[2]
with zipfile.ZipFile(dst, "w", zipfile.ZIP_DEFLATED) as zf:
    for root, dirs, files in os.walk(src):
        for f in files:
            if f.endswith(".pdb"): continue
            p = os.path.join(root, f)
            zf.write(p, os.path.relpath(p, src).replace(chr(92), chr(47)))
print("Created:", dst)
' build/windows/x64/runner/Release "$GITHUB_WORKSPACE/$APP_DIR/build/bot_creator-windows-x64-steam.zip"

      - name: Upload Windows Steam ZIP to release
        if: ${{ env.PUBLISH_RELEASE == 'true' && needs.prepare_release.outputs.msix_only != 'true' }}
        shell: pwsh
        run: |
          gh release upload $env:RELEASE_TAG "build/bot_creator-windows-x64-steam.zip" --clobber -R $env:GH_REPO

      - name: Upload Windows EXE to release
        if: ${{ startsWith(github.ref, 'refs/tags/v') && needs.prepare_release.outputs.msix_only != 'true' }}
        shell: pwsh
        run: |
          Get-ChildItem -Path build/windows/x64/runner/Release -Filter *.exe -File | ForEach-Object {
            gh release upload $env:RELEASE_TAG $_.FullName --clobber -R $env:GH_REPO
          }

      # --- ÉTAPES MSIX (S'EXÉCUTENT SI TAG 'v*' OU 'msix_only') ---
      - name: Set Store-compatible MSIX version
        if: ${{ startsWith(github.ref, 'refs/tags/v') || needs.prepare_release.outputs.msix_only == 'true' }}
        shell: pwsh
        run: |
          $pubspec = 'pubspec.yaml'
          $content = Get-Content -Raw $pubspec
          # On lit la version depuis le pubspec.yaml, donc ça reste basé sur ton code !
          $versionMatch = [regex]::Match($content, '(?m)^version:\s*([0-9]+)\.([0-9]+)\.([0-9]+)\+[0-9]+\s*$')
          if (-not $versionMatch.Success) {
            throw 'Unable to parse app version from pubspec.yaml'
          }
          $msixVersion = "$($versionMatch.Groups[1].Value).$($versionMatch.Groups[2].Value).$($versionMatch.Groups[3].Value).0"
          $updated = [regex]::Replace($content, '(?m)^\s*msix_version:\s*[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+\s*$', "  msix_version: $msixVersion")
          if ($updated -eq $content) {
            throw 'Unable to update msix_version in pubspec.yaml'
          }
          Set-Content -Path $pubspec -Value $updated -NoNewline
          Write-Host "MSIX version set to $msixVersion"

      - name: Create MSIX package
        if: ${{ startsWith(github.ref, 'refs/tags/v') || needs.prepare_release.outputs.msix_only == 'true' }}
        run: dart run msix:create

      - name: Upload Windows MSIX to release
        if: ${{ startsWith(github.ref, 'refs/tags/v') || needs.prepare_release.outputs.msix_only == 'true' }}
        shell: pwsh
        run: |
          Get-ChildItem -Path build/windows/x64/runner/Release -Filter *.msix -File | ForEach-Object {
            gh release upload $env:RELEASE_TAG $_.FullName --clobber -R $env:GH_REPO
          }
