name: Build Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  APP_DIR: packages/app
  FLUTTER_VERSION: "3.41.2"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build_linux_release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/app

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake curl git ninja-build pkg-config zip libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Get dependencies
        run: flutter pub get

      - name: Enable Linux Flutter Desktop
        run: flutter config --enable-linux-desktop

      - name: Build Linux release
        run: flutter build linux --release

      - name: Package Linux Steam bundle
        run: |
          mkdir -p "$GITHUB_WORKSPACE/$APP_DIR/build"
          tar -C build/linux/x64/release -czf "$GITHUB_WORKSPACE/$APP_DIR/build/bot_creator-linux-x64-steam.tar.gz" bundle

      - name: Archive Linux Steam bundle
        uses: actions/upload-artifact@v6
        with:
          name: linux-steam-tarball
          path: ${{ env.APP_DIR }}/build/bot_creator-linux-x64-steam.tar.gz

      - name: Build Linux AppImage
        run: bash packaging/linux/appimage/build_appimage.sh

      - name: Archive AppImage
        uses: actions/upload-artifact@v6
        with:
          name: linux-appimage
          path: ${{ env.APP_DIR }}/build/appimage/bot_creator-linux-x86_64.AppImage

  build_macos_release:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: packages/app

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Get dependencies
        run: flutter pub get

      - name: Enable macOS Flutter Desktop
        run: flutter config --enable-macos-desktop

      - name: Build macOS release
        run: flutter build macos --release

      - name: Package macOS Steam app bundle
        run: |
          APP_PATH=$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "No macOS app bundle found in build output." >&2
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" build/bot_creator-macos-universal-steam.zip

      - name: Archive macOS Steam bundle
        uses: actions/upload-artifact@v6
        with:
          name: macos-steam-zip
          path: ${{ env.APP_DIR }}/build/bot_creator-macos-universal-steam.zip

  build_windows_release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: packages/app

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~\AppData\Local\Pub\Cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Get dependencies
        run: flutter pub get

      - name: Enable Windows Flutter Desktop
        run: flutter config --enable-windows-desktop

      - name: Build Windows release
        run: flutter build windows --release

      - name: Package Windows Steam ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath build/bot_creator-windows-x64-steam.zip -Force

      - name: Archive Windows Steam ZIP
        uses: actions/upload-artifact@v6
        with:
          name: windows-steam-zip
          path: ${{ env.APP_DIR }}/build/bot_creator-windows-x64-steam.zip

      - name: Archive Windows EXE
        uses: actions/upload-artifact@v6
        with:
          name: windows-exe
          path: ${{ env.APP_DIR }}/build/windows/x64/runner/Release/*.exe

      - name: Set Store-compatible MSIX version
        shell: pwsh
        run: |
          $pubspec = 'pubspec.yaml'
          $content = Get-Content -Raw $pubspec
          $versionMatch = [regex]::Match($content, '(?m)^version:\s*([0-9]+)\.([0-9]+)\.([0-9]+)\+[0-9]+\s*$')
          if (-not $versionMatch.Success) {
            throw 'Unable to parse app version from pubspec.yaml'
          }
          $msixVersion = "$($versionMatch.Groups[1].Value).$($versionMatch.Groups[2].Value).$($versionMatch.Groups[3].Value).0"
          $updated = [regex]::Replace($content, '(?m)^\s*msix_version:\s*[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+\s*$', "  msix_version: $msixVersion")
          if ($updated -eq $content) {
            throw 'Unable to update msix_version in pubspec.yaml'
          }
          Set-Content -Path $pubspec -Value $updated -NoNewline
          Write-Host "MSIX version set to $msixVersion"

      - name: Create MSIX package
        run: dart run msix:create

      - name: Archive Windows MSIX
        uses: actions/upload-artifact@v6
        with:
          name: windows-msix
          path: ${{ env.APP_DIR }}/build/windows/x64/runner/Release/*.msix

  create_release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: [build_linux_release, build_macos_release, build_windows_release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7

      - name: Collect existing release assets
        id: release_assets
        shell: bash
        run: |
          shopt -s nullglob
          files=()
          patterns=(
            "linux-steam-tarball/bot_creator-linux-x64-steam.tar.gz"
            "linux-appimage/*.AppImage"
            "windows-steam-zip/bot_creator-windows-x64-steam.zip"
            "windows-msix/*.msix"
            "macos-steam-zip/bot_creator-macos-universal-steam.zip"
          )

          for pattern in "${patterns[@]}"; do
            for file in $pattern; do
              if [ -f "$file" ]; then
                files+=("$file")
              fi
            done
          done

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release assets were downloaded." >&2
            exit 1
          fi

          {
            echo "files<<EOF"
            printf '%s\n' "${files[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2.5.0
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          prerelease: false
          files: ${{ steps.release_assets.outputs.files }}
